# ViewMagnet CI/CD Pipeline
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref — rapid pushes no longer each run a
# full suite to completion (was burning GitHub Actions minutes fast).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# Minutes budget (private-repo free tier = 2000/mo): the jobs that GATE the
# deploy (backend-test, backend-lint, frontend-test, frontend-lint,
# deploy-scheduler) run on every push. The expensive VALIDATION jobs (e2e ~16m,
# docker build, trivy) run on pull_request only — Railway builds the real image
# itself, so docker-build on push was pure waste.

jobs:
  # ============================================================
  # Backend Tests
  # ============================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The ML dependency tree (torch, tensorflow, transformers, whisper,
      # easyocr, ultralytics, ...) overflows the runner's ~14GB free disk:
      # "OSError: [Errno 28] No space left on device" during pip install.
      # Purge the preinstalled toolchains we never use (~25GB reclaimed).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET_KEY: test-secret-key-for-ci-testing
          ENVIRONMENT: development
          TESTING: "1"
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_ml/test_thumbnail_predictor.py \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # Backend Lint
  # ============================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      # BLOCKING: ruff is gated on the "real bug" rule class (E9 + pyflakes F),
      # configured in pyproject.toml. Undefined names, unused imports, etc.
      # now fail the build instead of being silently ignored.
      - name: Run ruff
        run: ruff check src/

      # Non-blocking (informational): formatting is not yet enforced.
      - name: Check formatting with black
        run: black --check src/ --diff || true

      - name: Check imports with isort
        run: isort --check-only src/ --diff || true

  # ============================================================
  # Frontend Tests
  # ============================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        # No pinned version: reads "packageManager" from frontend/package.json
        # (pnpm@10.4.1). The hardcoded version: 8 broke pnpm install --frozen-lockfile
        # with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (lockfile is v9.0, written by pnpm 10).
        with:
          package_json_file: frontend/package.json

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # ============================================================
  # Frontend Lint
  # ============================================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        # No pinned version: reads "packageManager" from frontend/package.json
        # (pnpm@10.4.1). The hardcoded version: 8 broke pnpm install --frozen-lockfile
        # with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (lockfile is v9.0, written by pnpm 10).
        with:
          package_json_file: frontend/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BLOCKING: the `check` script is `tsc --noEmit`. It passes clean today,
      # so type errors now fail the build. (There is no `lint` script, so the
      # old `pnpm lint || true` step was a no-op and has been removed.)
      - name: Check TypeScript
        run: pnpm check

  # ============================================================
  # Build Docker Images
  # ============================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'pull_request'  # Railway builds the real image; PR-only validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same disk purge as backend-test: the backend image bakes in the full
      # ML stack and cache-to mode=max exports every layer — comfortably over
      # the runner's ~14GB free without this.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: viewmagnet-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: viewmagnet-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Security Scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================
  # E2E (remediation 1.3): Playwright against real API + frontend.
  # Advisory for now (continue-on-error) -- make blocking once it
  # proves stable on a few runs. Chromium-only in CI for speed;
  # playwright.config.ts self-boots both servers via webServer.
  # ============================================================
  e2e:
    name: E2E Tests (advisory)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'pull_request'  # PR-only: ~16m, advisory, not a deploy gate
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same disk-space purge as backend-test: this job pip-installs the full
      # ML dependency tree too.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        # No pinned version: reads "packageManager" from frontend/package.json
        # (pnpm@10.4.1). The hardcoded version: 8 broke pnpm install --frozen-lockfile
        # with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (lockfile is v9.0, written by pnpm 10).
        with:
          package_json_file: frontend/package.json

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run E2E tests (chromium)
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-testing
          ENVIRONMENT: development
          DEV_MODE: "true"
          CI: "true"
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================
  # Deploy: green main -> Railway
  #
  # The API and frontend services auto-deploy from GitHub
  # natively (enable "Wait for CI" in their Railway settings to gate
  # them on this workflow). The scheduler service is NOT GitHub-
  # connected -- forgetting to `railway up` it caused a 2-day silent
  # capture outage -- so it
  # deploys from here on every green main push.
  #
  # One-time setup: Railway dashboard -> project Settings -> Tokens ->
  # create a project token (production environment), then add it as
  # the RAILWAY_TOKEN secret in GitHub repo settings. Until the secret
  # exists this job no-ops with a warning instead of failing.
  # ============================================================
  deploy-scheduler:
    name: Deploy scheduler (Railway)
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint, frontend-test, frontend-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never let a scheduler-deploy hiccup mark the whole check suite red --
    # the API/frontend "Wait for CI" gates key off this suite, and a token or
    # Railway outage must not block THEIR deploys. Failures still surface in
    # the job log + the error annotation below.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy scheduler service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret not set - skipping scheduler deploy"
            exit 0
          fi
          npm install -g @railway/cli
          echo "--- railway context (diagnostics) ---"
          railway whoami || true
          railway status || true
          echo "--- deploying ---"
          if ! railway up --service scheduler --ci; then
            echo "::error::Scheduler deploy failed. If this is an auth error, the RAILWAY_TOKEN secret must be a PROJECT token (Railway dashboard -> project Settings -> Tokens), not an account token."
            exit 1
          fi
