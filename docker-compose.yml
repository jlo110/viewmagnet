# ViewMagnet Docker Compose Configuration
# Local development setup with all services

version: '3.8'

services:
  # ============================================================
  # Backend API
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      # DATABASE_URL comes from .env — point it at your Supabase connection string
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-for-local-development-only}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - REDIS_URL=redis://redis:6379/0
      # Run `alembic upgrade head` on container startup. Disable by setting
      # RUN_MIGRATIONS=false (e.g. for read-only canary deploys).
      - RUN_MIGRATIONS=true
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - viewmagnet

  # ============================================================
  # RQ Background Worker (durable distribution + shorts + render pipelines)
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["python", "-m", "src.queue.client"]
    environment:
      - ENVIRONMENT=development
      # DATABASE_URL comes from .env — point it at your Supabase connection string
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=false  # API container handles migrations
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    # Week 8: docker-compose probes the worker every 30s; an unhealthy
    # result (stuck worker + pending jobs) triggers a restart so a
    # crashed ffmpeg subprocess doesn't silently freeze the queue.
    healthcheck:
      test: ["CMD", "python", "-m", "src.queue.client", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - viewmagnet

  # ============================================================
  # Scheduler (single-instance periodic jobs — hourly metrics sweep)
  # ============================================================
  # MUST stay a single replica. The API runs multiple uvicorn workers, so the
  # scheduler cannot live there without firing each job once per worker. This
  # dedicated process owns all periodic jobs (see src/scheduler.py).
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["python", "-m", "src.scheduler"]
    environment:
      - ENVIRONMENT=development
      - RUN_SCHEDULER=true
      # DATABASE_URL comes from .env — point it at your Supabase connection string
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=false  # API container handles migrations
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - viewmagnet

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - viewmagnet

  # ============================================================
  # Frontend (Development)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/client:/app/client:ro
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - viewmagnet

  # ============================================================
  # Nginx Reverse Proxy (Production)
  # ============================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - viewmagnet
    profiles:
      - production

volumes:
  redis_data:

networks:
  viewmagnet:
    driver: bridge
